<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evento</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #ffffff;
            --success: #34c759;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 2rem 1.5rem;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }

        .logo {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 0.5rem 0;
            font-weight: 600;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            font-weight: 300;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .camera-btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 50px;
            padding: 1.2rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            transition: transform 0.2s ease, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .camera-btn.secondary {
            background-color: #2c2c2e;
            color: #ffffff;
            box-shadow: none;
        }

        .camera-btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .preview-card {
            display: none;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 1rem;
            margin-top: 1.5rem;
            text-align: left;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .media-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .media-container img, .media-container video {
            width: 100%;
            height: auto;
            max-height: 50vh;
            border-radius: 12px;
            display: block;
        }

        .file-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .file-info strong {
            color: var(--text-main);
        }

        .badge-original {
            display: inline-block;
            background-color: rgba(52, 199, 89, 0.2);
            color: var(--success);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 0.8rem;
        }

        .privacy-note {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo" id="eventLogo">✨</div>
        <h1 id="eventName">Cargando...</h1>
        <div class="subtitle">Captura el momento</div>
        
        <!-- Input 1: Cámara de foto directa -->
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;">
        
        <!-- Input 2: Archivo original sin compresión para videos 1080p/4K completos -->
        <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">

        <div class="btn-group">
            <button class="camera-btn" id="takePhotoBtn">
                📸 TOMAR FOTO NATIVA
            </button>
            <button class="camera-btn secondary" id="selectMediaBtn">
                🎥 SUBIR VIDEO 1080p / FOTO
            </button>
        </div>

        <div class="preview-card" id="previewCard">
            <span class="badge-original">✓ Archivo Original Capturado (1080p+)</span>
            <div class="media-container" id="mediaContainer"></div>
            <div class="file-info" id="fileInfo"></div>
        </div>

        <p class="privacy-note">Las fotos y videos que captures serán enviados al álbum digital del evento.</p>
    </div>

    <script>
        const CONFIG = {
            eventName: "Cumpleaños José Daniel",
            eventDate: "2026-09-29",
            driveFolderId: "XXXXXXXX",
            eventCode: "",
            logoEmoji: "✨"
        };

        document.getElementById('eventName').textContent = CONFIG.eventName;
        document.getElementById('eventLogo').textContent = CONFIG.logoEmoji;
        document.title = CONFIG.eventName;

        const photoInput = document.getElementById('photoInput');
        const fileInput = document.getElementById('fileInput');
        const previewCard = document.getElementById('previewCard');
        const mediaContainer = document.getElementById('mediaContainer');
        const fileInfo = document.getElementById('fileInfo');

        document.getElementById('takePhotoBtn').addEventListener('click', () => {
            photoInput.click();
        });

        document.getElementById('selectMediaBtn').addEventListener('click', () => {
            fileInput.click();
        });

        function handleFileSelection(file) {
            mediaContainer.innerHTML = '';
            const objectUrl = URL.createObjectURL(file);

            if (file.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = objectUrl;
                mediaContainer.appendChild(img);
            } else if (file.type.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = objectUrl;
                video.controls = true;
                video.playsInline = true;
                mediaContainer.appendChild(video);
            }

            const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);

            fileInfo.innerHTML = `
                <strong>Archivo:</strong> ${file.name}<br>
                <strong>Tipo:</strong> ${file.type || 'Desconocido'}<br>
                <strong>Tamaño original:</strong> ${sizeInMB} MB
            `;

            previewCard.style.display = 'block';
            previewCard.scrollIntoView({ behavior: 'smooth' });
        }

        photoInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) handleFileSelection(e.target.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) handleFileSelection(e.target.files[0]);
        });
    </script>
</body>
</html>
