<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evento</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #ffffff;
            --success: #34c759;
            --danger: #ff3b30;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding-bottom: 80px; /* Espacio para la barra flotante */
        }

        .container {
            padding: 2rem 1.5rem;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }

        .logo {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 0.5rem 0;
            font-weight: 600;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            font-weight: 300;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .camera-btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 50px;
            padding: 1.2rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            transition: transform 0.2s ease, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .camera-btn.secondary {
            background-color: #2c2c2e;
            color: #ffffff;
            box-shadow: none;
        }

        .upload-btn {
            background-color: var(--success);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 1.2rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            cursor: pointer;
            margin-top: 1rem;
            box-shadow: 0 4px 20px rgba(52, 199, 89, 0.3);
            transition: transform 0.2s ease, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .camera-btn:active, .upload-btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .preview-card {
            display: none;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 1rem;
            margin-top: 1.5rem;
            text-align: left;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .media-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .media-item {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
        }

        .media-item img, .media-item video {
            width: 100%;
            height: auto;
            max-height: 40vh;
            border-radius: 12px;
            display: block;
        }

        .remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .file-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-top: 0.5rem;
        }

        .badge-original {
            display: inline-block;
            background-color: rgba(52, 199, 89, 0.2);
            color: var(--success);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 0.8rem;
        }

        .privacy-note {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Indicador Flotante de Segundo Plano */
        .background-toast {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 999;
            align-items: center;
            gap: 10px;
            width: 85%;
            max-width: 350px;
            box-sizing: border-box;
        }

        .toast-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid var(--success);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo" id="eventLogo">✨</div>
        <h1 id="eventName">Cargando...</h1>
        <div class="subtitle">Captura el momento</div>
        
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;">
        <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display: none;">

        <div class="btn-group">
            <button class="camera-btn" id="takePhotoBtn">
                📸 TOMAR FOTO NATIVA
            </button>
            <button class="camera-btn secondary" id="selectMediaBtn">
                📁 ELEGIR DE GALERÍA (FOTO/VIDEO)
            </button>
        </div>

        <div class="preview-card" id="previewCard">
            <span class="badge-original" id="badgeText">✓ Archivos Seleccionados</span>
            <div class="media-grid" id="mediaGrid"></div>
            <div class="file-info" id="fileSummary"></div>
            
            <button class="upload-btn" id="uploadBtn">
                🚀 ENVIAR AL ÁLBUM
            </button>
        </div>

        <p class="privacy-note">Las fotos y videos que captures serán enviados al álbum digital del evento.</p>
    </div>

    <!-- Toast Flotante para Segundo Plano -->
    <div class="background-toast" id="bgToast">
        <div class="toast-spinner"></div>
        <span id="toastMsg">Subiendo archivos en segundo plano...</span>
    </div>

    <script>
        const CONFIG = {
            eventName: "Cumpleaños José Daniel",
            eventDate: "2026-09-29",
            driveFolderId: "1BTCQRh_eZUdGD0wqT6M9yzuR_Kn_1Y9X", // Asegúrate de colocar la ID de tu carpeta de Drive
            scriptUrl: "https://script.google.com/macros/s/AKfycbzudyCCbIlBvof2h4I2EmqQx92aEuvTx_LX_xNuPAIX_-QHeKG1jhP5tcsqtdDhCdDdFg/exec",
            logoEmoji: "✨"
        };

        let selectedFiles = [];
        let uploadQueue = [];
        let isUploading = false;

        document.getElementById('eventName').textContent = CONFIG.eventName;
        document.getElementById('eventLogo').textContent = CONFIG.logoEmoji;
        document.title = CONFIG.eventName;

        const photoInput = document.getElementById('photoInput');
        const fileInput = document.getElementById('fileInput');
        const previewCard = document.getElementById('previewCard');
        const mediaGrid = document.getElementById('mediaGrid');
        const fileSummary = document.getElementById('fileSummary');
        const badgeText = document.getElementById('badgeText');
        const uploadBtn = document.getElementById('uploadBtn');

        const bgToast = document.getElementById('bgToast');
        const toastMsg = document.getElementById('toastMsg');

        document.getElementById('takePhotoBtn').addEventListener('click', () => {
            photoInput.value = '';
            photoInput.click();
        });

        document.getElementById('selectMediaBtn').addEventListener('click', () => {
            fileInput.value = '';
            fileInput.click();
        });

        function addFiles(newFiles) {
            const incoming = Array.from(newFiles);
            selectedFiles = selectedFiles.concat(incoming);
            renderPreview();
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderPreview();
        }

        function renderPreview() {
            if (selectedFiles.length === 0) {
                previewCard.style.display = 'none';
                return;
            }

            mediaGrid.innerHTML = '';
            let totalSizeBytes = 0;

            selectedFiles.forEach((file, index) => {
                totalSizeBytes += file.size;
                const objectUrl = URL.createObjectURL(file);
                
                const itemDiv = document.createElement('div');
                itemDiv.className = 'media-item';

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '✕';
                removeBtn.onclick = () => removeFile(index);
                itemDiv.appendChild(removeBtn);

                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = objectUrl;
                    itemDiv.appendChild(img);
                } else if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.src = objectUrl;
                    video.controls = true;
                    video.playsInline = true;
                    itemDiv.appendChild(video);
                }

                mediaGrid.appendChild(itemDiv);
            });

            const totalSizeMB = (totalSizeBytes / (1024 * 1024)).toFixed(2);
            badgeText.textContent = `✓ ${selectedFiles.length} ${selectedFiles.length === 1 ? 'archivo listo' : 'archivos listos'} (Calidad Original)`;

            fileSummary.innerHTML = `
                <strong>Archivos en cola:</strong> ${selectedFiles.length}<br>
                <strong>Peso total acumulado:</strong> ${totalSizeMB} MB
            `;

            uploadBtn.textContent = '🚀 ENVIAR AL ÁLBUM';
            previewCard.style.display = 'block';
            previewCard.scrollIntoView({ behavior: 'smooth' });
        }

        photoInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) addFiles(e.target.files);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) addFiles(e.target.files);
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        // Agregar archivos seleccionados a la cola de segundo plano
        uploadBtn.addEventListener('click', () => {
            if (selectedFiles.length === 0) return;

            // Pasar archivos de la seleccion a la cola general
            uploadQueue = uploadQueue.concat(selectedFiles);
            selectedFiles = []; // Limpiar vista previa
            previewCard.style.display = 'none'; // Ocultar tarjeta inmediatamente

            // Iniciar o continuar proceso de envio en segundo plano
            processUploadQueue();
        });

        async function processUploadQueue() {
            if (isUploading || uploadQueue.length === 0) return;

            isUploading = true;
            bgToast.style.display = 'flex';

            while (uploadQueue.length > 0) {
                const totalInQueue = uploadQueue.length;
                toastMsg.textContent = `Enviando al álbum... (${totalInQueue} ${totalInQueue === 1 ? 'pendiente' : 'pendientes'})`;

                const file = uploadQueue[0];

                try {
                    const base64Data = await fileToBase64(file);
                    
                    const payload = {
                        folderId: CONFIG.driveFolderId,
                        files: [{
                            name: file.name || `captura_${Date.now()}.${file.type.split('/')[1] || 'jpg'}`,
                            type: file.type,
                            base64: base64Data
                        }]
                    };

                    await fetch(CONFIG.scriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });

                } catch (err) {
                    console.error('Error al enviar un archivo de la cola:', err);
                }

                // Remover el archivo procesado de la cola
                uploadQueue.shift();
            }

            // Finalizado
            toastMsg.textContent = '🎉 ¡Todos los archivos fueron enviados!';
            setTimeout(() => {
                bgToast.style.display = 'none';
                isUploading = false;
            }, 3000);
        }
    </script>
</body>
</html>
