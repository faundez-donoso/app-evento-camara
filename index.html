<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evento</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #ffffff;
            --success: #34c759;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 2rem 1.5rem;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }

        .logo {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 0.5rem 0;
            font-weight: 600;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            font-weight: 300;
        }

        .camera-btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 50px;
            padding: 1.2rem 2rem;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            transition: transform 0.2s ease, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .camera-btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        /* Panel de vista previa de captura */
        .preview-card {
            display: none;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 1rem;
            margin-top: 1.5rem;
            text-align: left;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .media-container {
            width: 100%;
            max-height: 300px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .media-container img, .media-container video {
            width: 100%;
            height: 100%;
            max-height: 300px;
            object-fit: contain;
        }

        .file-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .file-info strong {
            color: var(--text-main);
        }

        .badge-original {
            display: inline-block;
            background-color: rgba(52, 199, 89, 0.2);
            color: var(--success);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 0.8rem;
        }

        .privacy-note {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo" id="eventLogo">✨</div>
        <h1 id="eventName">Cargando...</h1>
        <div class="subtitle">Captura el momento</div>
        
        <!-- Input HTML5 nativo invisible para invocación directa de cámara -->
        <input type="file" id="cameraInput" accept="image/*,video/*" capture="environment" style="display: none;">

        <button class="camera-btn" id="openCameraBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
            </svg>
            ABRIR CÁMARA
        </button>

        <!-- Tarjeta de confirmación y detalles del archivo original -->
        <div class="preview-card" id="previewCard">
            <span class="badge-original">✓ Archivo Original Capturado</span>
            <div class="media-container" id="mediaContainer"></div>
            <div class="file-info" id="fileInfo"></div>
        </div>

        <p class="privacy-note">Las fotos y videos que captures serán enviados al álbum digital del evento.</p>
    </div>

    <script>
        const CONFIG = {
            eventName: "Cumpleaños José Daniel",
            eventDate: "2026-09-29",
            driveFolderId: "XXXXXXXX",
            eventCode: "",
            logoEmoji: "✨"
        };

        document.getElementById('eventName').textContent = CONFIG.eventName;
        document.getElementById('eventLogo').textContent = CONFIG.logoEmoji;
        document.title = CONFIG.eventName;

        const openCameraBtn = document.getElementById('openCameraBtn');
        const cameraInput = document.getElementById('cameraInput');
        const previewCard = document.getElementById('previewCard');
        const mediaContainer = document.getElementById('mediaContainer');
        const fileInfo = document.getElementById('fileInfo');

        // Abrir la cámara nativa al pulsar el botón
        openCameraBtn.addEventListener('click', () => {
            cameraInput.click();
        });

        // Evento que se dispara al finalizar la captura nativa
        cameraInput.addEventListener('change', (event) => {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const file = files[0]; // Objeto File original proporcionado por el sistema

            // Limpiar vista previa anterior
            mediaContainer.innerHTML = '';
            
            // Generar URL temporal local en memoria sin recodificar ni modificar el blob
            const objectUrl = URL.createObjectURL(file);

            if (file.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = objectUrl;
                mediaContainer.appendChild(img);
            } else if (file.type.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = objectUrl;
                video.controls = true;
                video.autoplay = false;
                mediaContainer.appendChild(video);
            }

            // Formatear tamaño del archivo en MB
            const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);

            // Mostrar metadatos originales sin alterar
            fileInfo.innerHTML = `
                <strong>Archivo:</strong> ${file.name}<br>
                <strong>Tipo:</strong> ${file.type || 'Desconocido'}<br>
                <strong>Tamaño original:</strong> ${sizeInMB} MB
            `;

            previewCard.style.display = 'block';
            
            // Scroll suave hacia la vista previa
            previewCard.scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
