<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evento</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #ffffff;
            --success: #34c759;
            --danger: #ff3b30;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 2rem 1.5rem;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }

        .logo {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 0.5rem 0;
            font-weight: 600;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            font-weight: 300;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .camera-btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 50px;
            padding: 1.2rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            transition: transform 0.2s ease, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .camera-btn.secondary {
            background-color: #2c2c2e;
            color: #ffffff;
            box-shadow: none;
        }

        .camera-btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .preview-card {
            display: none;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 1rem;
            margin-top: 1.5rem;
            text-align: left;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .media-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .media-item {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
        }

        .media-item img, .media-item video {
            width: 100%;
            height: auto;
            max-height: 40vh;
            border-radius: 12px;
            display: block;
        }

        .remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .file-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-top: 0.5rem;
        }

        .badge-original {
            display: inline-block;
            background-color: rgba(52, 199, 89, 0.2);
            color: var(--success);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 0.8rem;
        }

        .privacy-note {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo" id="eventLogo">✨</div>
        <h1 id="eventName">Cargando...</h1>
        <div class="subtitle">Captura el momento</div>
        
        <!-- Inputs limpios para permitir re-selección de fotos -->
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;">
        <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display: none;">

        <div class="btn-group">
            <button class="camera-btn" id="takePhotoBtn">
                📸 TOMAR FOTO NATIVA
            </button>
            <button class="camera-btn secondary" id="selectMediaBtn">
                📁 ELEGIR DE GALERÍA (FOTO/VIDEO)
            </button>
        </div>

        <div class="preview-card" id="previewCard">
            <span class="badge-original" id="badgeText">✓ 0/10 Archivos Seleccionados</span>
            <div class="media-grid" id="mediaGrid"></div>
            <div class="file-info" id="fileSummary"></div>
        </div>

        <p class="privacy-note">Las fotos y videos que captures serán enviados al álbum digital del evento.</p>
    </div>

    <script>
        const CONFIG = {
            eventName: "Cumpleaños José Daniel",
            eventDate: "2026-09-29",
            driveFolderId: "XXXXXXXX",
            eventCode: "",
            logoEmoji: "✨"
        };

        const MAX_FILES = 10;
        let selectedFiles = []; // Arreglo global acumulativo

        document.getElementById('eventName').textContent = CONFIG.eventName;
        document.getElementById('eventLogo').textContent = CONFIG.logoEmoji;
        document.title = CONFIG.eventName;

        const photoInput = document.getElementById('photoInput');
        const fileInput = document.getElementById('fileInput');
        const previewCard = document.getElementById('previewCard');
        const mediaGrid = document.getElementById('mediaGrid');
        const fileSummary = document.getElementById('fileSummary');
        const badgeText = document.getElementById('badgeText');

        document.getElementById('takePhotoBtn').addEventListener('click', () => {
            if (selectedFiles.length >= MAX_FILES) {
                alert(`Has alcanzado el límite máximo de ${MAX_FILES} archivos.`);
                return;
            }
            photoInput.value = ''; // Reset para activar cambio siempre
            photoInput.click();
        });

        document.getElementById('selectMediaBtn').addEventListener('click', () => {
            if (selectedFiles.length >= MAX_FILES) {
                alert(`Has alcanzado el límite máximo de ${MAX_FILES} archivos.`);
                return;
            }
            fileInput.value = ''; // Reset para activar cambio siempre
            fileInput.click();
        });

        function addFiles(newFiles) {
            const incoming = Array.from(newFiles);
            const availableSlots = MAX_FILES - selectedFiles.length;

            if (incoming.length > availableSlots) {
                alert(`Solo puedes agregar ${availableSlots} archivo(s) más. Se aplicará el límite de ${MAX_FILES} archivos en total.`);
            }

            const filesToAdd = incoming.slice(0, availableSlots);
            selectedFiles = selectedFiles.concat(filesToAdd);
            renderPreview();
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderPreview();
        }

        function renderPreview() {
            if (selectedFiles.length === 0) {
                previewCard.style.display = 'none';
                return;
            }

            mediaGrid.innerHTML = '';
            let totalSizeBytes = 0;

            selectedFiles.forEach((file, index) => {
                totalSizeBytes += file.size;
                const objectUrl = URL.createObjectURL(file);
                
                const itemDiv = document.createElement('div');
                itemDiv.className = 'media-item';

                // Botón para eliminar archivo individual
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '✕';
                removeBtn.onclick = () => removeFile(index);
                itemDiv.appendChild(removeBtn);

                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = objectUrl;
                    itemDiv.appendChild(img);
                } else if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.src = objectUrl;
                    video.controls = true;
                    video.playsInline = true;
                    itemDiv.appendChild(video);
                }

                mediaGrid.appendChild(itemDiv);
            });

            const totalSizeMB = (totalSizeBytes / (1024 * 1024)).toFixed(2);
            badgeText.textContent = `✓ ${selectedFiles.length}/${MAX_FILES} Archivos listos (Calidad Original)`;

            fileSummary.innerHTML = `
                <strong>Archivos en cola:</strong> ${selectedFiles.length} de ${MAX_FILES}<br>
                <strong>Peso total acumulado:</strong> ${totalSizeMB} MB
            `;

            previewCard.style.display = 'block';
            previewCard.scrollIntoView({ behavior: 'smooth' });
        }

        photoInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) addFiles(e.target.files);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) addFiles(e.target.files);
        });
    </script>
</body>
</html>
